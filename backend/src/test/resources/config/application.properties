# Loaded in addition to the main application.yml during tests
app.security.jwt.secret=test-only-secret-with-at-least-32-characters
app.scheduling.enabled=false
# Never call the real AI provider from tests
app.ai.gemini.api-key=
# Many test classes share one context and one client IP; LoginRateLimitTest sets its own low limits
app.security.login-attempts.max-failures-per-ip=100000
app.security.login-attempts.max-registrations-per-ip=100000
app.security.login-attempts.max-failures-per-email=100000
