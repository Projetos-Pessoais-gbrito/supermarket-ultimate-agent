spring:
  application:
    name: supermarket-agent-api
  config:
    # Local secrets live in the repository root .env (never committed)
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:supermarket}
    username: ${POSTGRES_USER:supermarket}
    password: ${POSTGRES_PASSWORD:supermarket}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  ai:
    gemini:
      # Free key from https://aistudio.google.com/apikey; AI features are skipped when empty
      api-key: ${GEMINI_API_KEY:}
      model: gemini-flash-lite-latest
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-ttl: 1h

server:
  error:
    include-stacktrace: never

sefaz:
  sp:
    connect-timeout: 5s
    read-timeout: 15s
    # Be polite to SEFAZ: at most one request per interval, across all users
    min-interval: 1s
    max-attempts: 3
    retry-backoff: 1s
