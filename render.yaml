# Render Blueprint: the API (see docs/DEPLOY.md). The database is a free Neon PostgreSQL.
services:
  - type: web
    name: supermarket-agent-api
    runtime: docker
    # Render has no South America region; Virginia is the closest (Neon runs in us-east-1 too)
    region: virginia
    # Free instances sleep after 15 min idle; the first request then takes about a minute
    plan: free
    branch: main
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    buildFilter:
      paths:
        - backend/**
    # Liveness does not query the database, so health checks let Neon scale to zero
    healthCheckPath: /actuator/health/liveness
    envVars:
      # Asked for when the Blueprint is created: Neon → Connect, connection pooling off
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        value: supermarket
      - key: POSTGRES_SSLMODE
        value: require
      - key: JWT_SECRET
        generateValue: true
      # Asked for when the Blueprint is created; AI features are skipped when empty
      - key: GEMINI_API_KEY
        sync: false
      # Take the client IP from Render's proxy so login rate limits are per user (ADR 0006)
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: native
